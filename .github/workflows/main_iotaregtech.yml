name: Build and deploy Python app to Azure Web App - IOTARegTech

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies (validation step)
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Upload backend artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-backend-app
          path: |
            backend/
            !backend/antenv/
            !backend/__pycache__/
            !backend/test_logs/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-backend-app
          path: backend

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: "IOTARegTech"
          slot-name: "Production"
          package: "backend"
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}